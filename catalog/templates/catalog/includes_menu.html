<!-- Шапка сайта (верхнее меню) -->
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
    <h5 class="my-0 me-md-auto fw-normal">Skystore</h5>
    <nav class="ms-md-5">

        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 text-dark fw-bold" href="{% url 'blog:list' %}">Блог</a>
    </nav>
</div>

<div class="nav-auth-links">
    {% if user.is_authenticated %}
        <span class="navbar-text me-3">Вы вошли как: <b>{{ user.email }}</b></span>
        <form action="{% url 'users:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">Выйти</button>
        </form>

    {% else %}
        <a href="{% url 'users:login' %}" class="btn btn-outline-primary me-2">Войти</a>
        <a href="{% url 'users:register' %}" class="btn btn-primary">Регистрация</a>
    {% endif %}
</div>
