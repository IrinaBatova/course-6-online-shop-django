{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <h2 class="mb-4 text-center fw-bold">Добавление товара</h2>
        
        <!-- Обязательно указываем enctype для работы с загрузкой файлов/картинок -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Циклом выводим красиво оформленные поля из ModelForm -->
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Сохранить товар</button>
        </form>
    </div>
</div>
{% endblock %}
